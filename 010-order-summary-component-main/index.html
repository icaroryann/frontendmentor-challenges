<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/media-queries.css" media="screen and (min-width: 768px)">
  
  <title>Frontend Mentor | Order summary card</title>

</head>
<body>

  <div class="card">
    <div class="banner">
      <img src="images/illustration-hero.svg" alt="Man listening to music">
    </div>
    
    <section>
      <h1>Order Summary</h1>
      <p>
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>
      <div class="plan">
        <img src="images/icon-music.svg" alt="Icon music">
        <div class="type-plan">Annual Plan</div>
        <div class="price">$59.99/year</div>
        <a href="#">Change</a>
      </div>
    </section>
    <section class="payment">
      <button>Proceed to Payment</button>
      <a href="#">Cancel Order</a>
    </section>
  </div>
  
</body>
</html>
