<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!--Google Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/style.css">

  <script src="https://kit.fontawesome.com/5d764b026c.js" crossorigin="anonymous"></script>
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

</head>
<body>
  <main>
    <section class="header">
      <img src="images/logo.svg" alt="logo" class="logo">
      <img src="images/illustration-mockups.svg" alt="Illustration mockups" class="mockups">
    </section>
    
    <section class="content">
      <h1>Build The Community Your Fans Will Love</h1>

      <p>
        Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
        Create connections with your users as you engage in genuine discussion.
      </p> 
      
      <button>Register</button>
    </section>
  </main>

  <footer>
    <div class="social-container">
      <i class="fa-brands fa-facebook-f"></i>
    </div>
    <div class="social-container">
      <i class="fa-brands fa-x-twitter"></i>
    </div>
    <div class="social-container">
      <i class="fa-brands fa-instagram"></i>
    </div>
  </footer>
</body>
</html>
