<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="styles/style.css">
  
  <title>Frontend Mentor | Stats preview card component</title>

</head>
<body>

  <div class="card">
    <div class="banner">
      <img src="images/image-header-mobile.jpg" alt="Women working">
    </div>
    <div class="content">
      <h1>Get <strong>insights</strong> that help your business grow.</h1>
      <p>
        Discover the benefits of data analytics and make better decisions regarding revenue, customer
        experience, and overall efficiency.
      </p>
      <div class="table">
        <div class="companies"><strong>10k+</strong><br> companies</div>
        <div class="templates"><strong>314</strong><br> templates</div>
        <div class="queries"><strong>12m+</strong><br> queries</div>
      </div>
    </div>
  </div>

</body>
</html>
