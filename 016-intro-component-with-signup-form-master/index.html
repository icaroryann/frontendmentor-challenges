<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="styles/style.css">
  
  <title>Frontend Mentor | Intro component with sign up form</title>

</head>
<body>
  <header>
    <h1>
      Learn to code by<br>watching others
    </h1>

    <p>
      See how experienced developers solve problems in real-time. Watching scripted tutorials is great, 
      but understanding how developers think is invaluable. 
    </p>
  </header>

  <div class="sign-up">
    <button><p><strong>Try it free 7 days</strong> then $20/mo. thereafter</p></button>

    <form action="formulario.php" method="get" autocomplete="on">
      <input type="text" name="first-name" id="box-fname" placeholder="First Name">
      <input type="text" name="last-name" id="box-lname" placeholder="Last Name">
      <input type="email" name="email" id="box-email" placeholder="Email Address">
      <input type="password" name="pass" id="box-pass" placeholder="Password">

      <button type="submit">Claim your free trial </button>
    
    </form>
    <div class="note">By clicking the button, you are agreeing to our <a href="#">Terms and Services</a></div>
  </div>
