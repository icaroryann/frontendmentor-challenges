<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;1,400;1,800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles/style.css">
  <link rel="stylesheet" href="assets/styles/media-queries.css" media="screen and (min-width:768px)">
  
  <title>Frontend Mentor | Age calculator app</title>

</head>
<body>
  <div class="calculator">
    <form id="form" novalidate>
      <div class="inputs">
        <label for="day">DAY</label>
        <input type="number" name="day" id="day" placeholder="DD">
        <span class="messageError one">error1</span>
  
        <label for="month">MONTH</label>
        <input type="number" name="month" id="month" placeholder="MM">
        <span class="messageError two">error2</span>
  
        <label for="year">YEAR</label>
        <input type="number" name="year" id="year" placeholder="YYYY">
        <span class="messageError tree">error3</span>
      </div>

      <div class="button">
        <hr>
        
        <button type="submit">
          <img src="assets/images/icon-arrow.svg" alt="Arrow-icon">
        </button>
      </div>

    </form>

    <section class="time-passed">
      <p><strong class="result-year">- - </strong>years</p>
      <p><strong class="result-month">- - </strong>months</p>
      <p><strong class="result-day">- - </strong>days</p>
    </section>
  </div>

  <script src="./assets/scripts/script.js"></script>
</body>
</html>
